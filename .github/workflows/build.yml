name: Build Muse APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (plataforma 35)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK (release firmado)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Mostrar tamaño del APK
        run: ls -lh app/build/outputs/apk/release/*.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: muse-apk
          path: app/build/outputs/apk/release/*.apk
